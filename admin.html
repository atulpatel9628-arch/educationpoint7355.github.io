<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Education Point - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #14213d;
      padding: 30px 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .header p {
      color: #718096;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      margin-top: 17px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e0eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 10px 18px;
      background: #ef4444;
      float: right;
    }

    .logout:hover {
      background: #dc2626;
    }

    .info {
      margin-top: 12px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="loginScreen" style="
  display:none;
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
">

  <h2>🔐 Admin Login</h2>

  <p style="color:#64748b;margin:8px 0 20px;">
    Education Point Admin Panel
  </p>

  <input
    type="email"
    id="loginEmail"
    placeholder="Admin email"
    style="
      width:100%;
      padding:13px;
      margin-bottom:12px;
      border:1px solid #d9e0eb;
      border-radius:10px;
    "
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    style="
      width:100%;
      padding:13px;
      margin-bottom:12px;
      border:1px solid #d9e0eb;
      border-radius:10px;
    "
  >

  <button
    onclick="loginAdmin()"
    style="margin-top:5px;"
  >
    🔑 Login
  </button>

  <div
    id="loginStatus"
    class="status"
  ></div>

</div>

<div id="adminApp" style="display:none;">

  <div class="container">

  <div class="header">
    <button class="logout" onclick="logout()">Logout</button>

    <h1>🎓 Education Point</h1>
    <p>Private Admin Panel</p>

    <div style="clear:both"></div>
  </div>


  <div class="card">

    <h2>📚 Upload Study Material</h2>

    <!-- CLASS -->

    <label for="classSelect">Class</label>

    <select id="classSelect">
      <option value="">Select Class</option>
    </select>


    <!-- SUBJECT -->

    <label for="subjectSelect">Subject</label>

    <select id="subjectSelect" disabled>
      <option value="">Select Subject</option>
    </select>


    <!-- TITLE -->

    <label for="title">Material Title</label>

    <input
      type="text"
      id="title"
      placeholder="Example: Chapter 1 Notes"
    >


    <!-- CHAPTER -->

    <label for="chapter">Chapter</label>

    <input
      type="text"
      id="chapter"
      placeholder="Example: Chemical Reactions"
    >


    <!-- PDF -->

    <label for="pdfFile">PDF File</label>

    <input
      type="file"
      id="pdfFile"
      accept="application/pdf"
    >

    <p class="info">
      Only PDF files are allowed.
    </p>


    <!-- UPLOAD -->

    <button id="uploadBtn" onclick="uploadMaterial()">
      📤 Upload Material
    </button>


    <div id="status" class="status"></div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL = "https://zpvqgrqgxckzxkoygeqo.supabase.co";

const SUPABASE_KEY = "sb_publishable_Fm2B3h3_qyVMKcGc_CABcA_FU0ptpud";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   CHECK LOGIN
   ========================================= */

async function checkLogin() {

  const loginScreen =
    document.getElementById("loginScreen");

  const adminApp =
    document.getElementById("adminApp");

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error || !session) {

    adminApp.style.display = "none";
    loginScreen.style.display = "block";

    return;
  }

  loginScreen.style.display = "none";
  adminApp.style.display = "block";

  loadClasses();
  loadAdminMaterials();
}
  async function loginAdmin() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const status =
    document.getElementById("loginStatus");

  if (!email || !password) {

    status.textContent =
      "Email aur password dono enter karo.";

    status.className =
      "status error";

    return;
  }

  status.textContent = "⏳ Logging in...";
  status.className = "status";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    status.textContent =
      "❌ " + error.message;

    status.className =
      "status error";

    return;
  }

  status.textContent =
    "✅ Login successful!";

  status.className =
    "status success";

  checkLogin();
}
/* =========================================
   LOAD CLASSES
   ========================================= */

async function loadClasses() {

  const select = document.getElementById("classSelect");

  const { data, error } = await supabaseClient
    .from("classes")
    .select("*")
    .order("id");

  if (error) {
    showStatus(
      "Class load nahi ho rahi: " + error.message,
      "error"
    );
    return;
  }

  select.innerHTML =
    '<option value="">Select Class</option>';

  data.forEach(item => {

    const option = document.createElement("option");

    option.value = item.id;

    option.textContent =
      item.name || item.class_name || item.title || ("Class " + item.id);

    select.appendChild(option);

  });
}


/* =========================================
   LOAD SUBJECTS
   ========================================= */

document
  .getElementById("classSelect")
  .addEventListener("change", async function () {

    const classId = this.value;

    const subjectSelect =
      document.getElementById("subjectSelect");

    subjectSelect.innerHTML =
      '<option value="">Loading subjects...</option>';

    subjectSelect.disabled = true;

    if (!classId) {
      subjectSelect.innerHTML =
        '<option value="">Select Subject</option>';
      return;
    }


    const { data, error } = await supabaseClient
      .from("subjects")
      .select("*")
      .eq("class_id", classId)
      .order("id");


    if (error) {

      showStatus(
        "Subject load nahi ho raha: " + error.message,
        "error"
      );

      subjectSelect.innerHTML =
        '<option value="">Select Subject</option>';

      return;
    }


    subjectSelect.innerHTML =
      '<option value="">Select Subject</option>';


    data.forEach(item => {

      const option = document.createElement("option");

      option.value = item.id;

      option.textContent =
        item.name ||
        item.subject_name ||
        item.title ||
        ("Subject " + item.id);

      subjectSelect.appendChild(option);

    });


    subjectSelect.disabled = false;

  });


/* =========================================
   UPLOAD MATERIAL
   ========================================= */

async function uploadMaterial() {

  const classId =
    document.getElementById("classSelect").value;

  const subjectId =
    document.getElementById("subjectSelect").value;

  const title =
    document.getElementById("title").value.trim();

  const chapter =
    document.getElementById("chapter").value.trim();

  const file =
    document.getElementById("pdfFile").files[0];

  const uploadBtn =
    document.getElementById("uploadBtn");


  /* VALIDATION */

  if (!classId) {
    showStatus("Please select a class.", "error");
    return;
  }

  if (!subjectId) {
    showStatus("Please select a subject.", "error");
    return;
  }

  if (!title) {
    showStatus("Please enter material title.", "error");
    return;
  }

  if (!chapter) {
    showStatus("Please enter chapter.", "error");
    return;
  }

  if (!file) {
    showStatus("Please select a PDF file.", "error");
    return;
  }


  if (file.type !== "application/pdf") {
    showStatus("Only PDF files are allowed.", "error");
    return;
  }


  uploadBtn.disabled = true;
  uploadBtn.textContent = "Uploading...";


  try {

    /* =====================================
       CREATE UNIQUE FILE NAME
       ===================================== */

    const safeName =
      file.name
        .replace(/[^a-zA-Z0-9.-]/g, "_");

    const filePath =
      Date.now() + "_" + safeName;


    /* =====================================
       UPLOAD PDF TO STORAGE
       ===================================== */

    const { error: uploadError } =
      await supabaseClient.storage
        .from("study-material")
        .upload(filePath, file, {
          contentType: "application/pdf",
          upsert: false
        });


    if (uploadError) {
      throw uploadError;
    }


    /* =====================================
       GET PUBLIC URL
       ===================================== */

    const { data: publicData } =
      supabaseClient.storage
        .from("study-material")
        .getPublicUrl(filePath);


    const fileUrl =
      publicData.publicUrl;


    /* =====================================
       SAVE MATERIAL IN DATABASE
       ===================================== */

    const { error: insertError } =
      await supabaseClient
        .from("materials")
        .insert({

          class_id: Number(classId),

          subject_id: Number(subjectId),

          title: title,

          chapter: chapter,

          material_type: "PDF",

          file_url: fileUrl

        });


    if (insertError) {
      throw insertError;
    }


    /* =====================================
       SUCCESS
       ===================================== */

    showStatus(
      "✅ PDF successfully uploaded!",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("title").value = "";

    document.getElementById("chapter").value = "";

    document.getElementById("pdfFile").value = "";


  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Upload failed: " + error.message,
      "error"
    );

  }


  uploadBtn.disabled = false;

  uploadBtn.textContent =
    "📤 Upload Material";

}


/* =========================================
   STATUS MESSAGE
   ========================================= */

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status " + type;

}


/* =========================================
   LOGOUT
   ========================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "admin.html";

}


/* =========================================
   START
   ========================================= */

checkLogin();

 /* =========================================
   LOAD ADMIN MATERIALS
========================================= */

async function loadAdminMaterials() {

  const container =
    document.getElementById("adminMaterialsList");

  if (!container) return;

  container.innerHTML = `
    <p style="color:#64748b;">
      ⏳ Loading materials...
    </p>
  `;


  const { data, error } =
    await supabaseClient
      .from("materials")
      .select(`
        id,
        title,
        chapter,
        material_type,
        file_url,
        created_at,
        classes(name),
        subjects(name)
      `)
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    container.innerHTML = `
      <div style="
        padding:15px;
        border-radius:10px;
        background:#fee2e2;
        color:#991b1b;
      ">
        ❌ Materials load nahi ho pa rahe.
        <br>
        ${escapeAdminText(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div style="
        padding:25px;
        text-align:center;
        color:#64748b;
      ">
        📚 Abhi koi uploaded material nahi hai.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(material => {

    const card =
      document.createElement("div");

    card.style.cssText = `
      border:1px solid #e5e7eb;
      border-radius:15px;
      padding:18px;
      margin-bottom:14px;
      background:#fff;
    `;


    const className =
      material.classes?.name || "Unknown Class";

    const subjectName =
      material.subjects?.name || "Unknown Subject";


    card.innerHTML = `

      <div style="
        display:flex;
        justify-content:space-between;
        gap:15px;
        flex-wrap:wrap;
      ">

        <div style="min-width:0;">

          <div style="
            font-size:12px;
            color:#2563eb;
            font-weight:bold;
            margin-bottom:6px;
          ">
            ${escapeAdminText(className)}
            →
            ${escapeAdminText(subjectName)}
          </div>


          <h3 style="
            margin:5px 0;
            color:#111827;
          ">
            📄
            ${escapeAdminText(
              material.title || "Untitled PDF"
            )}
          </h3>


          <p style="
            margin:5px 0;
            color:#64748b;
            font-size:14px;
          ">
            📖
            ${escapeAdminText(
              material.chapter || "No chapter"
            )}
          </p>

        </div>


        <div style="
          display:flex;
          gap:8px;
          flex-wrap:wrap;
          align-items:center;
        ">

          ${
            material.file_url
            ? `
              <a
                href="${escapeAdminText(
                  material.file_url
                )}"
                target="_blank"
                rel="noopener"
                style="
                  text-decoration:none;
                  background:#2563eb;
                  color:white;
                  padding:9px 13px;
                  border-radius:8px;
                  font-weight:bold;
                  font-size:13px;
                "
              >
                📄 Open
              </a>
            `
            : ""
          }


          <button
            type="button"
            onclick="editMaterial('${material.id}')"
            style="
              width:auto;
              margin:0;
              padding:9px 13px;
              background:#f59e0b;
              border-radius:8px;
              font-size:13px;
            "
          >
            ✏️ Edit
          </button>


          <button
            type="button"
            onclick="deleteMaterial('${material.id}')"
            style="
              width:auto;
              margin:0;
              padding:9px 13px;
              background:#dc2626;
              border-radius:8px;
              font-size:13px;
            "
          >
            🗑️ Delete
          </button>

        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =========================================
   ESCAPE ADMIN TEXT
========================================= */

function escapeAdminText(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   EDIT MATERIAL
========================================= */

async function editMaterial(id) {

  const newTitle =
    prompt(
      "New material title:"
    );

  if (newTitle === null) {
    return;
  }


  const title =
    newTitle.trim();


  if (!title) {

    alert(
      "Title empty nahi ho sakta."
    );

    return;
  }


  const newChapter =
    prompt(
      "New chapter name:"
    );

  if (newChapter === null) {
    return;
  }


  const chapter =
    newChapter.trim();


  const { error } =
    await supabaseClient
      .from("materials")
      .update({
        title: title,
        chapter: chapter
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "❌ Edit failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Material updated successfully!"
  );


  loadAdminMaterials();

}


/* =========================================
   DELETE MATERIAL
========================================= */

async function deleteMaterial(id) {

  const confirmDelete =
    confirm(
      "⚠️ Kya tum is material ko delete karna chahte ho?"
    );


  if (!confirmDelete) {
    return;
  }


  /*
   * First get the file URL.
   */

  const { data: material, error: fetchError } =
    await supabaseClient
      .from("materials")
      .select("id, file_url")
      .eq("id", id)
      .single();


  if (fetchError) {

    alert(
      "❌ Material find nahi hua: " +
      fetchError.message
    );

    return;
  }


  /*
   * Delete database record.
   */

  const { error: deleteError } =
    await supabaseClient
      .from("materials")
      .delete()
      .eq("id", id);


  if (deleteError) {

    alert(
      "❌ Delete failed: " +
      deleteError.message
    );

    return;
  }


  /*
   * Delete PDF from Storage.
   */

  if (material.file_url) {

    try {

      const marker =
        "/storage/v1/object/public/study-material/";

      const index =
        material.file_url.indexOf(marker);


      if (index !== -1) {

        const filePath =
          decodeURIComponent(
            material.file_url.substring(
              index + marker.length
            )
          );


        await supabaseClient
          .storage
          .from("study-material")
          .remove([filePath]);

      }

    } catch (storageError) {

      console.error(
        "Storage delete error:",
        storageError
      );

    }

  }


  alert(
    "✅ Material deleted successfully!"
  );


  loadAdminMaterials();

} 
</script>

</body>
</html>

    <button

    >

  </div>

    <p style="color:#64748b;">

    </p>

  </div>

</div>
